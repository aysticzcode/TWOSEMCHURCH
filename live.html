<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Altar | T.W.O.S.E.M</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
    <style>
        #video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; width: 100%; min-height: 400px; background: #0a0a0a; border-radius: 20px; padding: 15px; border: 1px solid #1a1a1a; }
        .video-box { width: 100%; height: 250px; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid #222; position: relative; }
        .video-box div { width: 100% !important; height: 100% !important; }
        .user-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; font-size: 9px; font-weight: 900; color: #D4AF37; text-transform: uppercase; z-index: 10; border-radius: 6px; }
    </style>
</head>
<body class="bg-black text-white">

    <nav class="w-full border-b border-yellow-600/30 sticky top-0 z-50 bg-black">
        <div class="flex justify-between items-center px-6 py-4">
            <a href="index.html" class="text-[10px] font-black text-red-600 border border-red-600 px-4 py-1 rounded-full uppercase">← EXIT TO HOME</a>
            <img src="logo.png" class="w-10 h-10 rounded-full border-2 border-yellow-600 object-cover" onerror="this.src='https://via.placeholder.com/50/D4AF37/000000?text=W'">
        </div>
    </nav>

    <div class="max-w-5xl mx-auto p-6">
        <div id="video-grid" class="mt-10"></div>

        <div class="mt-12 flex flex-col items-center">
            <button id="joinBtn" onclick="startCall()" class="btn-main w-full max-w-md py-5 rounded-full text-[11px] font-black uppercase tracking-widest">Start / Join Live Altar</button>
            <div id="controls" class="hidden mt-8 bg-zinc-900/90 px-12 py-5 rounded-full border border-white/10">
                <button onclick="leaveCall()" class="text-red-500 font-black text-[11px] uppercase">Leave Altar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="db.js"></script>

    <script>
        const APP_ID = "91f6d8b59cb14bbab3aafe2b21dc2acf";
        const CHANNEL = "WOSEM";
        let client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localTracks = { videoTrack: null, audioTrack: null };

        async function startCall() {
            try {
                // Force permission prompt
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                stream.getTracks().forEach(track => track.stop());

                await client.join(APP_ID, CHANNEL, null, null);
                localTracks.audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                localTracks.videoTrack = await AgoraRTC.createCameraVideoTrack();

                createVideoBox("local-player", "You (Host)");
                localTracks.videoTrack.play("local-player");
                await client.publish([localTracks.audioTrack, localTracks.videoTrack]);

                client.on("user-published", async (user, mediaType) => {
                    await client.subscribe(user, mediaType);
                    if (mediaType === "video") {
                        createVideoBox(`user-${user.uid}`, "Member");
                        user.videoTrack.play(`user-${user.uid}`);
                    }
                    if (mediaType === "audio") { user.audioTrack.play(); }
                });

                document.getElementById('joinBtn').classList.add('hidden');
                document.getElementById('controls').classList.remove('hidden');
            } catch (e) {
                alert("Please enable Camera/Mic in your phone settings and refresh.");
            }
        }

        function createVideoBox(id, labelText) {
            const container = document.createElement("div");
            container.className = "relative";
            container.innerHTML = `<div id="${id}" class="video-box border-yellow-600/40"></div><div class="user-label">${labelText}</div>`;
            document.getElementById("video-grid").appendChild(container);
            
            const v = container.querySelector('video');
            if(v) { v.setAttribute('playsinline', 'true'); v.setAttribute('autoplay', 'true'); }
        }

        async function leaveCall() {
            for (let t in localTracks) { if (localTracks[t]) { localTracks[t].stop(); localTracks[t].close(); } }
            await client.leave();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
