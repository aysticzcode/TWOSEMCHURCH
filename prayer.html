<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Request | T.W.O.S.E.M</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">

    <nav class="w-full border-b border-yellow-600/30 bg-black">
        <div class="flex flex-col items-center py-4">
            <a href="index.html"><img src="logo.png" class="w-14 h-14 rounded-full border-2 border-yellow-600 mb-2 object-cover" onerror="this.src='https://via.placeholder.com/150/D4AF37/000000?text=WOS'"></a>
            <div class="flex flex-wrap justify-center gap-x-5 gap-y-2 px-4 mt-2">
                <a href="index.html" class="text-[10px] font-black text-gray-400 hover:text-white uppercase">Home</a>
                <a href="prayer.html" class="text-[10px] font-black gold-text uppercase">Prayer</a>
                <a href="live.html" class="text-[10px] font-black text-gray-400 hover:text-white uppercase tracking-widest">Live</a>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-black gold-text uppercase italic leading-none">Prophetic Altar</h1>
            <p class="text-gray-500 text-[10px] tracking-[0.4em] mt-4 uppercase">Submit Your Prayer Requests</p>
        </div>

        <form id="prayerForm" class="bg-zinc-950 p-8 rounded-3xl border border-white/5 space-y-6 shadow-2xl">
            <div>
                <label class="text-[9px] font-black uppercase text-gray-600 mb-2 block">Full Name</label>
                <input type="text" id="name" required class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-yellow-600 outline-none transition" placeholder="Enter your name">
            </div>

            <div>
                <label class="text-[9px] font-black uppercase text-gray-600 mb-2 block">Prayer Request</label>
                <textarea id="request" required rows="5" class="w-full bg-black border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-yellow-600 outline-none transition" placeholder="Tell us what you want God to do..."></textarea>
            </div>

            <button type="submit" class="btn-main w-full py-4 text-[11px] font-black uppercase tracking-widest">Send to Altar</button>
        </form>

        <div class="mt-12 text-center">
            <p class="text-[10px] text-gray-500 leading-relaxed italic">
                "The effectual fervent prayer of a righteous man availeth much." <br>— James 5:16
            </p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="db.js"></script>

    <script>
        // Simple logic to handle form submission
        document.getElementById('prayerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const request = document.getElementById('request').value;

            // This will send to your Firebase if db.js is set up correctly
            console.log("Prayer sent for:", name);
            alert("Your prayer request has been sent to the Altar. God bless you!");
            this.reset();
        });
    </script>
</body>
</html>
